name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          This release fixes audited measure-evaluation and packaging defects, adds regression coverage, strengthens continuous integration, and adds the browser-based GitHub Pages evaluator.

          Key changes:
          - exact calendar lookback boundaries;
          - corrected encounter qualification and FIT-DNA evaluation;
          - corrected paired systolic/diastolic blood-pressure handling;
          - explicit errors for unsupported measure identifiers;
          - reliable installed CLI entry point;
          - local browser execution with Pyodide;
          - updated documentation and implementation-scope warnings.
          EOF

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
