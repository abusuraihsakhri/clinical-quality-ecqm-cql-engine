name: Clinical Quality eCQM / CQL Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest Suite
      run: |
        python -m pytest -p no:zarr -v

    - name: Run CLI Batch Smoke Test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        python -c "
        import os
        assert os.path.exists('out_smoke.csv'), 'Smoke test output CSV not generated'
        with open('out_smoke.csv', 'r') as f:
            lines = f.readlines()
        assert len(lines) > 1, 'Smoke test output CSV is empty'
        print(f'Smoke test passed with {len(lines) - 1} records')
        "
        rm out_smoke.csv
