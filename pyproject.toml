[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-quality-ecqm-cql-engine"
version = "2.1.0"
description = "Reference implementation for evaluating simplified electronic clinical quality measure logic"
readme = "README.md"
authors = [{ name = "NAME" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
clinical-quality-ecqm-cql-engine = "ecqm_cql_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clinical-quality-ecqm-cql-engine"
Repository = "https://github.com/abusuraihsakhri/clinical-quality-ecqm-cql-engine.git"
