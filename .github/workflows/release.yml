name: Publish release

on:
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Publish release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          This release fixes audited measure-evaluation and packaging defects, adds regression coverage, strengthens continuous integration, and adds the browser-based GitHub Pages evaluator.

          Key changes:
          - exact calendar lookback boundaries;
          - corrected encounter qualification and FIT-DNA evaluation;
          - corrected paired systolic/diastolic blood-pressure handling;
          - explicit errors for unsupported measure identifiers;
          - reliable installed CLI entry point;
          - local browser execution with Pyodide;
          - updated documentation and implementation-scope warnings.
          EOF

          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md
