name: Clinical Quality eCQM / CQL Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q ecqm_cql_engine cli.py tests

      - name: Run test suite
        run: python -m pytest -p no:zarr -v

      - name: Verify installed console entry point
        run: clinical-quality-ecqm-cql-engine --list-measures

      - name: Run CLI batch smoke test
        run: |
          python cli.py batch -i sample.csv -o out_smoke.csv
          python - <<'PY'
          import csv
          from pathlib import Path

          output = Path("out_smoke.csv")
          assert output.exists(), "Smoke test output CSV was not generated"
          with output.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert rows, "Smoke test output CSV is empty"
          print(f"Smoke test passed with {len(rows)} records")
          PY
          rm out_smoke.csv

  web-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pages assets
        run: |
          test -f docs/index.html
          test -f docs/style.css
          test -f docs/app.js
          grep -q 'id="analyze"' docs/index.html
          grep -q 'loadPyodide' docs/app.js
          grep -q 'replaceChildren' docs/app.js
